<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- outer track -->
  <circle cx="32" cy="32" r="24" stroke="#2a2a3a" stroke-width="4" fill="none"/>
  <!-- progress arc ~270deg -->
  <circle cx="32" cy="32" r="24"
    stroke="url(#g)" stroke-width="4" fill="none"
    stroke-linecap="round"
    stroke-dasharray="150.8 150.8"
    stroke-dashoffset="37.7"
    transform="rotate(-90 32 32)"/>
  <!-- center dot -->
  <circle cx="32" cy="32" r="6" fill="url(#g)"/>
  <!-- crown notch -->
  <rect x="28" y="4" width="8" height="5" rx="2.5" fill="#7c6fff"/>
  <defs>
    <linearGradient id="g" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c6fff"/>
      <stop offset="100%" stop-color="#ff6f84"/>
    </linearGradient>
  </defs>
</svg>
